name: Render approved carousel 002
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-002.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact renderer dependency
        run: python -m pip install Pillow==12.3.0
      - name: Render approved slide source
        run: python scripts/render_002_carousel.py --input posts/002-when-should-abortion-be-legal/slides.json --outdir /tmp/carousel002
      - name: Verify image bytes against approved media
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          hashes = ["c7f98da446754cac7f509416772bf607a319f8605da42182a482fab3e923accd","2263f96a0e8b8cee36b04a3987c182664ed2ca7a4604e4a3aaf6079c47ad17a7","1a9d13dcaeb9d7a07f2e80a640ef8b95caae33a912ef0894709bcdd77c25d84b","546b0a68997a09b73d5d07659ce865875b7f14cc86abd0d9c796b2bb25de9b47","d62ef701218bbcfdcf04f1a29ccaf8dad11e23e19875706b56a23973cc1a8757","ebb2d8872227933fc2efc45a1dec6ba592e042f8101a93ab4508f4c1db86bf08","1624a87c1f5c3679c50bb10911a93ad3c8db627e6ab644934e18af9739796ff1","9698488e3d19606e97b455113b9c0cb1562725138169dfab27a281e6b16fa348","f4d05299563e3449de86d1ec77fa8d1bfb1a7e318bb9509714e79fc399cc8a8b","e9858ca7a12ba1eeddf861c9af389cb31f66733b5079d9e3f29e7d4a1b03cc56"]
          target = Path("posts/002-when-should-abortion-be-legal")
          for i, expected in enumerate(hashes,1):
              src = Path(f"/tmp/carousel002/slide-{i:02d}.png")
              actual = hashlib.sha256(src.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"BLOCKED: slide {i:02d} differs from approved media: {actual}")
              shutil.copyfile(src, target / f"{i:02d}.png")
          print("All ten images exactly match approved PNG hashes")
          PY
      - name: Commit approved media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/002-when-should-abortion-be-legal/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Archive approved carousel 002 images"
            git push
          fi

name: Verify public access to approved media 002
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-002-public.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch all images anonymously from public raw GitHub URLs
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, pathlib
          hashes=["c7f98da446754cac7f509416772bf607a319f8605da42182a482fab3e923accd","2263f96a0e8b8cee36b04a3987c182664ed2ca7a4604e4a3aaf6079c47ad17a7","1a9d13dcaeb9d7a07f2e80a640ef8b95caae33a912ef0894709bcdd77c25d84b","546b0a68997a09b73d5d07659ce865875b7f14cc86abd0d9c796b2bb25de9b47","d62ef701218bbcfdcf04f1a29ccaf8dad11e23e19875706b56a23973cc1a8757","ebb2d8872227933fc2efc45a1dec6ba592e042f8101a93ab4508f4c1db86bf08","1624a87c1f5c3679c50bb10911a93ad3c8db627e6ab644934e18af9739796ff1","9698488e3d19606e97b455113b9c0cb1562725138169dfab27a281e6b16fa348","f4d05299563e3449de86d1ec77fa8d1bfb1a7e318bb9509714e79fc399cc8a8b","e9858ca7a12ba1eeddf861c9af389cb31f66733b5079d9e3f29e7d4a1b03cc56"]
          prefix="https://raw.githubusercontent.com/Alan4511/unexamined-premise-posts/c0d047b4fa9b9486f790220391c2cafb7fdef510/posts/002-when-should-abortion-be-legal/"
          for i,want in enumerate(hashes,1):
              url=prefix+f"{i:02d}.png"
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"carousel-public-validation"}),timeout=30) as response:
                  ct=response.headers.get("Content-Type","")
                  data=response.read()
                  assert response.status==200 and "image/png" in ct, (url,response.status,ct)
              assert hashlib.sha256(data).hexdigest()==want, ("hash mismatch",url)
          p=pathlib.Path("posts/002-when-should-abortion-be-legal/media-verified.json")
          p.write_text(json.dumps({"commit":"c0d047b4fa9b9486f790220391c2cafb7fdef510","public_media_verified":True,"sha256":hashes},indent=2)+"\n")
          print("Verified 10 unauthenticated public images, exact SHA-256 matches")
          PY
      - name: Record verification result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/002-when-should-abortion-be-legal/media-verified.json
          git commit -m "Verify public access and image integrity for carousel 002"
          git push
